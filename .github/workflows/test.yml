name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '30.1' # Change to your target Emacs version

      - name: Stage config files into ~/.emacs.d
        run: |
          mkdir -p ~/.emacs.d/lisp
          cp early-init.el init.el ~/.emacs.d/
          cp lisp/*.el ~/.emacs.d/lisp/

      - name: Run ERT Tests
        run: |
          emacs -Q --batch \
            --eval '(package-initialize)' \
            -l ert \
            -l init.el \
            -l lisp/tests.el \
            -l lisp/dape-java-tests.el \
            -l lisp/tab-config-tests.el \
            -l lisp/modeline-tests.el \
            -l lisp/menu-config-tests.el \
            -f ert-run-tests-batch-and-exit
